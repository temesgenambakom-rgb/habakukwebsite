<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ school }} - Seensa</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-box">
    <h1>{{ school }}</h1>

    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('school_login', school_id=school_id) }}" method="POST">
        <input type="text" name="username" placeholder="Username" autocomplete="username" required>

        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>

        <button type="submit">Seeni</button>
    </form>

    <a href="/" style="display:block; text-align:center; margin-top:15px; font-size:13px; color:#777; text-decoration:none;">
        ← Mana barnootaa biraa filadhu
    </a>
</div>

</body>
</html>
