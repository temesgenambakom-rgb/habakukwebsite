<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manneen Barnootaa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px #aaa;
        }

        h1 {
            text-align: center;
            color: green;
        }

        .success-msg {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .school-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .school-card h3 {
            margin-top: 0;
            color: #333;
        }

        label {
            font-size: 13px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #aaa;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

<h1>🔑 Password Manneen Barnootaa</h1>

{% if message %}
<p class="success-msg">{{ message }}</p>
{% endif %}

<form method="POST" action="/admin/passwords">

    {% for account in accounts %}
    <div class="school-card">
        <h3>🏫 {{ account.school }}</h3>

        <label>Username</label>
        <input type="text" name="username_{{ loop.index0 }}" value="{{ account.username }}" required>

        <label>Password</label>
        <input type="text" name="password_{{ loop.index0 }}" value="{{ account.password }}" required>
    </div>
    {% endfor %}

    <button type="submit">💾 Olkaa'i Jijjiirama</button>

</form>

<a class="back" href="/dashboard">
    ← Dashboard deebi'i
</a>

</div>

</body>
</html>
